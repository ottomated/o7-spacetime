name: Publish
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install spacetime
        run: curl -sSf https://install.spacetimedb.com | sh -s -- -y

      - name: Install pnpm
        uses: pnpm/setup@a0881977cd8ea73b1ed212236c99ca10dcc80cf4 # v3
        with:
          cache: true
          runtime: node@lts
          install: true
          require-lockfile: true

      - name: Lint
        run: pnpm lint

      - name: Test
        run: |
          export PATH="/root/.local/bin:$PATH"
          pnpm exec playwright install chromium
          pnpm exec playwright install-deps chrome
          pnpm test:e2e

      - name: Publish
        run: pnpm publish
